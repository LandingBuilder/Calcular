<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular - PDV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', Courier, monospace; background-color: #e9ecef; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 10px; width: 100%; max-width: 300px; border-radius: 4px; }
        .header-print { text-align: center; border-bottom: 2px solid #000; margin-bottom: 10px; padding-bottom: 5px; }
        .header-print h1 { margin: 0; font-size: 20px; text-transform: uppercase; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
        input[type=number] { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #333; font-size: 18px; text-align: center; }
        .btn-group { display: flex; gap: 5px; margin-bottom: 10px; width: 100%; }
        button { flex: 1; padding: 12px; border: 1px solid #333; cursor: pointer; font-weight: bold; background: #fff; }
        #addBtn { background: #000; color: #fff; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { text-align: left; padding: 6px 2px; font-size: 14px; }
        .total-container { margin-top: 15px; padding-top: 8px; border-top: 2px solid #000; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; }

        @media print {
            @page { margin: 0; }
            body { background: white; padding: 0; margin: 0; }
            .container { max-width: 72mm; padding: 2mm; margin: 0 auto; }
            #valorInput, .btn-group, .btn-delete, th:nth-child(3), td:nth-child(3) { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-print">
        <h1>Popular</h1>
    </div>

    <input type="number" id="valorInput" placeholder="0.00" autofocus>
    
    <div class="btn-group">
        <button id="addBtn" onclick="adicionarValor()">ADICIONAR</button>
        <button id="printBtn" onclick="window.print()">IMPRIMIR</button>
    </div>

    <table id="tabelaValores">
        <thead>
            <tr>
                <th>NOTA</th>
                <th>VALOR</th>
                <th style="width: 30px;"></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="total-container">
        <span>TOTAL:</span>
        <span id="somaTotal">R$ 0,00</span>
    </div>
</div>

<script>
    let total = 0;

    document.getElementById('valorInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') adicionarValor();
    });

    function adicionarValor() {
        const input = document.getElementById('valorInput');
        const valor = parseFloat(input.value);
        if (isNaN(valor) || valor <= 0) return;

        const tbody = document.querySelector('#tabelaValores tbody');
        const novaLinha = tbody.insertRow();
        
        // Criamos as células com classes para facilitar a atualização
        novaLinha.innerHTML = `
            <td class="col-nome"></td>
            <td>${valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
            <td style="text-align:right">
                <button class="btn-delete" style="color:red; border:none; background:none; font-weight:bold; cursor:pointer;" 
                onclick="removerItem(this, ${valor})">X</button>
            </td>
        `;

        total += valor;
        atualizarNumeracao();
        atualizarInterface(input);
    }

    function removerItem(btn, valor) {
        btn.closest('tr').remove();
        total -= valor;
        if (total < 0) total = 0;
        
        atualizarNumeracao(); // Recontagem após remover
        atualizarInterface();
    }

    // NOVA FUNÇÃO: Percorre a tabela e renomeia as notas de 1 até o fim
    function atualizarNumeracao() {
        const linhas = document.querySelectorAll('#tabelaValores tbody tr');
        linhas.forEach((linha, index) => {
            const celulaNome = linha.querySelector('.col-nome');
            celulaNome.innerText = `Nota ${index + 1}`;
        });
    }

    function atualizarInterface(inputFocus = null) {
        document.getElementById('somaTotal').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        if (inputFocus) { 
            inputFocus.value = ''; 
            inputFocus.focus(); 
        }
    }
</script>

</body>
</html>
